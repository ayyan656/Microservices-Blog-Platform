name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ============================================================================
  # LINT AND TEST STAGE
  # ============================================================================
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, post-service, comment-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run linting (if configured)
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests (if configured)
        working-directory: ${{ matrix.service }}
        run: npm test --if-present
        continue-on-error: true

  # ============================================================================
  # BUILD STAGE
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service: [user-service, post-service, comment-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile/Dockerfile
          push: false
          tags: blog-platform/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # INTEGRATION TEST STAGE
  # ============================================================================
  integration-test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test .env file
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=testpassword123
          MYSQL_ROOT_PASSWORD=testpassword123
          JWT_SECRET=test-jwt-secret-for-ci-only
          JWT_EXPIRES_IN=1h
          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=guest
          EOF

      - name: Start services with Docker Compose
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for all services to become healthy..."
          sleep 30
          docker compose ps
          
      - name: Check service health - User Service
        run: |
          curl -f http://localhost:5000/api/auth/health || exit 1
          echo "✅ User Service is healthy"

      - name: Check service health - Post Service
        run: |
          curl -f http://localhost:5001/api/health || exit 1
          echo "✅ Post Service is healthy"

      - name: Check service health - Comment Service
        run: |
          curl -f http://localhost:5002/api/comments/health || exit 1
          echo "✅ Comment Service is healthy"

      - name: Check nginx gateway
        run: |
          curl -f http://localhost:80/health || exit 1
          echo "✅ Nginx Gateway is healthy"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ============================================================================
  # SECURITY SCAN STAGE
  # ============================================================================
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities, just report
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # DOCKER PUSH STAGE (Only on main branch)
  # ============================================================================
  push:
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [user-service, post-service, comment-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
