# Production Nginx configuration with SSL/TLS termination, HTTPS redirect, and secure headers
# This configuration implements industry best practices for:
# - SSL/TLS 1.2+ with strong cipher suites
# - HTTPS redirect (HTTP → HTTPS)
# - HSTS (HTTP Strict Transport Security)
# - Security headers (X-Frame-Options, X-Content-Type-Options, etc.)
# - Reverse proxy to multiple backend microservices
# - Rate limiting and DDoS protection basics
# - Gzip compression for performance

# HTTP server block - redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Required for Let's Encrypt certificate renewal
    # Certbot needs to access /.well-known/acme-challenge/ over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    # This ensures all traffic is encrypted
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block - primary production server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL certificate paths (provided by Let's Encrypt via Certbot)
    # These paths are mounted as volumes in docker-compose.ssl.yml
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL/TLS protocol configuration
    # Only TLS 1.2 and 1.3 for maximum security
    # TLS 1.0 and 1.1 are disabled due to known vulnerabilities
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cipher suite priority:
    # 1. ECDHE: Elliptic Curve Diffie-Hellman Ephemeral for perfect forward secrecy
    # 2. AES-256-GCM: Strong 256-bit AES encryption with Galois/Counter Mode
    # 3. CHACHA20: Modern AEAD cipher for older TLS 1.2 implementations
    # Ciphers are ordered by preference; Nginx will use the first supported cipher
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # Prefer server-side cipher ordering instead of client preference
    # This ensures the strongest ciphers are always used
    ssl_prefer_server_ciphers on;

    # SSL session configuration
    # Session caching improves performance by reusing SSL sessions
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Diffie-Hellman parameter file for perfect forward secrecy
    # Generated during setup: openssl dhparam -out /etc/nginx/dhparam.pem 2048
    # This file is included in the Dockerfile or generated at runtime
    ssl_dhparam /etc/nginx/dhparam.pem;

    # OCSP stapling - improves certificate validation performance
    # Nginx fetches OCSP response from Let's Encrypt and staples it to the SSL handshake
    # This prevents clients from needing to contact OCSP responders
    ssl_stapling on;
    ssl_stapling_verify on;

    # OCSP resolver - CloudFlare's public DNS resolver
    # Used to fetch OCSP responses asynchronously
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # HTTP Strict Transport Security (HSTS)
    # Forces browsers to use HTTPS for all future requests to this domain
    # max-age: 63072000 seconds = 2 years (recommended for production)
    # includeSubDomains: applies HSTS to all subdomains
    # preload: allows domain to be added to HSTS preload list (https://hstspreload.org)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers to prevent common web vulnerabilities
    # X-Frame-Options: DENY prevents clickjacking by disallowing framing
    add_header X-Frame-Options "DENY" always;

    # X-Content-Type-Options: nosniff prevents MIME type sniffing attacks
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection: enables XSS filter in browsers (defense in depth)
    add_header X-XSS-Protection "1; mode=block" always;

    # Content-Security-Policy: restricts resource loading to prevent XSS
    # This is a basic policy; customize based on your application needs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # Referrer-Policy: controls how much referrer information is shared
    # "strict-origin-when-cross-origin" balances privacy and functionality
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy: controls which browser features can be used
    # Restricts access to camera, microphone, geolocation, etc.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression settings
    # Compresses responses to reduce bandwidth usage and improve page load time
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Rate limiting zones
    # This creates a zone called "api_limit" that tracks requests by IP address
    # Limit: 10 requests per second per IP address
    # Burst: Allow up to 20 requests in a burst (above the limit)
    # Nodelay: Don't queue excess requests, immediately return 429
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Client body size limit
    # Prevents large uploads; adjust based on your API requirements
    client_max_body_size 10M;

    # User Service (Authentication, Registration, Profile)
    # Routes: /api/auth/*, /users/*, etc.
    location /api/auth/ {
        # Apply rate limiting to authentication endpoints
        limit_req zone=auth_limit burst=10 nodelay;

        # Proxy configuration
        proxy_pass http://user-service:3001;
        proxy_http_version 1.1;

        # Headers to pass to backend service
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;

        # Connection settings for stability
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings to prevent backend overload
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # WebSocket support (if needed for real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /users/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://user-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Post Service (CRUD operations on blog posts)
    # Routes: /api/posts/*, /posts/*, etc.
    location /api/posts/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://post-service:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    location /posts/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://post-service:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Comment Service (Comments on blog posts)
    # Routes: /api/comments/*, /comments/*, etc.
    location /api/comments/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://comment-service:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    location /comments/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://comment-service:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint for load balancers
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Handle 404 for undefined routes
    location / {
        return 404;
    }

    # Deny access to sensitive files/directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to common sensitive files
    location ~ ^/(wp-admin|wp-login|\.env|\.git|\.gitignore)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
