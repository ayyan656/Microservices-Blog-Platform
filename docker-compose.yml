version: '3.8'

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  # PostgreSQL - User Service Database
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123!}
      POSTGRES_DB: blog_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - blog-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U blog_user -d blog_db" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # MongoDB - Post Service Database
  mongodb:
    image: mongo:7-jammy
    container_name: blog-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: post_service
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - blog-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # MySQL - Comment Service Database
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SecurePassword123!}
      MYSQL_DATABASE: comment_service_db
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - blog-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-SecurePassword123!}" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  # Redis - Caching & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blog-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 5s

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: blog-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - blog-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================================
  # APPLICATION SERVICES
  # ============================================================================

  # User Service (Auth) - PostgreSQL
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile/Dockerfile
    container_name: blog-user-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: blog_db
      DB_USER: blog_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123!}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    networks:
      - blog-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/api/auth/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})" ]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Post Service - MongoDB
  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile/Dockerfile
    container_name: blog-post-service
    restart: unless-stopped
    env_file:
      - ./post-service/.env
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/post_service
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5001:5001"
    networks:
      - blog-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5001/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})" ]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Comment Service - MySQL
  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile/Dockerfile
    container_name: blog-comment-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SecurePassword123!}
      DB_NAME: comment_service_db
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5002:5002"
    networks:
      - blog-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5002/api/comments/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})" ]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Frontend Service - React/Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - blog-network
    depends_on:
      - user-service
      - post-service
      - comment-service
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # GATEWAY / REVERSE PROXY
  # ============================================================================

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - blog-network
    depends_on:
      - user-service
      - post-service
      - comment-service
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  blog-network:
    driver: bridge
    name: blog-platform-network

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    name: blog-postgres-data
  mongodb_data:
    name: blog-mongodb-data
  mysql_data:
    name: blog-mysql-data
  redis_data:
    name: blog-redis-data
  rabbitmq_data:
    name: blog-rabbitmq-data
